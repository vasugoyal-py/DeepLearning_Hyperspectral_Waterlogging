[project]
name = "deepwaterlog"
version = "1.0.0"
description = "Deep Learning–Enabled Hyperspectral Remote Sensing for Agricultural Waterlogging Detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "flask",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff"]
raster = ["rasterio>=1.3"]
paper = ["matplotlib>=3.8"]
docs = ["pypdf>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
python-preference = "only-managed"
